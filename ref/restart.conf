#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# Sample configuration for Minimization (?) and Equilibration (?)
# of Ubiquitin in a Water Box


#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          ionized.psf	;# topology file of the system
coordinates        ionized.pdb	;# coordinate data for the system
outputName         myoutput   	;# output file name basename

# SET command defines a VARIABLE
set temperature    300  ;# from paper (first step of min)

# Continuing a job from the restart files


# Quick way of turning off sections
if {0} {
set inputname      myinput
binCoordinates     $inputname.restart.coor
binVelocities      $inputname.restart.vel  ;# remove the "temperature" entry if you use this!
extendedSystem	   $inputname.xsc
} 

firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
# Charm, Amber Force fields are compatible
paraTypeCharmm	    on
parameters          par_all27_prot_lipid.inp

# NOTE: Do not set the initial velocity temperature if you 
# have also specified a .vel restart file!
temperature         $temperature
 

# Periodic Boundary conditions
# NOTE: Do not set the periodic cell basis if you have also 
# specified an .xsc restart file!
# TODO: are these the correct numbers?
if {1} { 
cellBasisVector1    41.0  0    0
cellBasisVector2     0   42.0  0
cellBasisVector3     0    0   46.0
cellOrigin          30   29    18
}
# What happens to atoms exiting from the box
# Wrapping around creates a discontinuity in the coordinates.
wrapWater           off
wrapAll             off


# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0    # from paper
switching           on
# Switching function starts at 10.0
switchdist          10.0
# Extra monitoration area
pairlistdist        14.0


# Integrator Parameters
timestep            2.0  ;# 2fs/step; from paper
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2  
stepspercycle       10


#PME (for full-system periodic electrostatics)
# TODO: set correct parameter from paper (12 A?)
if {1} {
PME                 yes
PMEGridSpacing      1.0

#manual grid definition
#PMEGridSizeX        32
#PMEGridSizeY        32
#PMEGridSizeZ        64
}

# Constant Temperature Control
# TODO: should we copy the paper for this?
langevin            on    ;# do langevin dynamics
langevinDamping     1     ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    no    ;# don't couple langevin bath to hydrogens


# Constant Pressure Control (variable volume)
# TODO: should we copy the paper for this?
if {1} {
useGroupPressure      yes ;# needed for 2fs steps
useFlexibleCell       no  ;# no for water box, yes for membrane
useConstantArea       no  ;# no for water box, yes for membrane

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.0
langevinPistonDecay   50.0
langevinPistonTemp    $temperature
}

# Step period between output writes
restartfreq         500     ;# 500steps = every 1ps
dcdfreq             500     ;# Frequency it writes the dcd trajectory
xstFreq             500     ;# Size of the box
outputEnergies      100
outputPressure      100


# Fixed Atoms Constraint (set PDB beta-column to 1)
# If fixing atom position is needed (wanted) during the equilibration stages.
# (for example the backbone).
# Needs a .pdb file of {0, 1} for each atom for {free, fixed}.

# TODO: restraint heavy solute atoms
if {0} {
fixedAtoms          on
fixedAtomsFile      myfixedatoms.pdb
fixedAtomsCol       B
}


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

# Put here any custom parameters that are specific to 
# this job (e.g., SMD, TclForces, etc...)



#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
# NOT WHEN RESTARTING
if {1} {
minimize            100
reinitvels          $temperature
}

run 50000 ;# 100ps





