#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# Minimization and Equilibration of 
# Ubiquitin in a Water Box


#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          ../common/ubq_wb.psf ;# topology file of the system
coordinates        ../common/ubq_wb.pdb ;# coordinate data for the system

# NOTE: SET command defines a VARIABLE
set temperature    300
set outputname     ubq_wb_eq

# NOTE: Number value for the first time step of the simulation.
# Useful when restarting (should be adjusted)
firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on					;# whether parameter file is in CHARMM format or not (on|off)
parameters          ../common/par_all27_prot_lipid.inp 	;# force field parameter file
temperature         $temperature			;# initial temperature of the system (K)

# NOTE: The temperature is contrained by assigning random velocities to atoms 
# following a Maxwell distribution
# WARN: Do not set the initial velocity temperature if there is a specified .vel 
# restart file


# Force-Field Parameters
exclude             scaled1-4	;# atomic interactions to exclude based on relative distance
1-4scaling          1.0		;# degree electrostatic interaction scaling strength (0-1)
cutoff              12.0	;# cutoff distance
switching           on		;# switching function (on|off)
switchdist          10.0	;# switching distance
pairlistdist        14.0	;# search distance for candidate atoms (> cutoff)

# NOTE: when using the PME method, the command cutoff
# dictates the separation between long and short range forces for the
# method; it does not simply turn off interactions


# Integrator Parameters
timestep            2.0  ;# 2fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1	 ;# frequency, in steps, of nonbonded interactions calculation
fullElectFrequency  2    ;# frequency, in steps, of full electrostatic interactions calc
stepspercycle       10	 ;# steps before reset pairlistdist


# Constant Temperature Control
langevin            on    ;# do langevin dynamics (on|off)
langevinDamping     1     ;# damping coefficient (gamma) of 1/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens (on|off)


# Periodic Boundary Conditions

# NOTE: The 3 cellBasisVector define three vector of an orthogonal base.
# They are used to define the periodic cell shape and size.

cellBasisVector1    58.0    0.   0.0
cellBasisVector2     0.0  58.0   0.0
cellBasisVector3     0.0    0   54.0
cellOrigin          17.0   35.1  37.3

# wrapWater           off	;# only for pbc wrap water molecules (on|off)
wrapAll             off	;# only for pbc, wrap molecules (on|off)

# NOTE: PME or MSM:
# - MSM (Multilevel Summation Method) is a useful method for dealing with electrostatic interactions 
# in a system with non fully periodic boundary conditions;
# - PME (Particle Mesh Ewald) is more efficient for small periodic systems.

# PME (for full-system periodic electrostatics)
PME                 yes ;# (yes|no)
PMEGridSpacing      1.0 ;# minimum ratio between the number of PME grid points along each cellBasisVector and the physical dimensions. Large enough so that the grid spacing accurately reproduces charge distribution. Typically around 1Å

#manual grid definition
#PMEGridSizeX        45
#PMEGridSizeY        45
#PMEGridSizeZ        48


# Variable Pressure Control (variable volume) (NVT)
useGroupPressure      yes ;# whether interactions involving hydrogen should be counted for all Hs or simply between groups of Hs. yes if rigidBonds
useFlexibleCell       no ;# whether the cell can vary independently (yes|no)
useConstantArea       no ;# whether to keep x-y cross sectional area constant while varying z dim. (yes|no)

# NVT
if {0}{
langevinPiston        on
langevinPistonTarget  1.01325		;#  in bar -> 1 atm (pressure to maintain)
langevinPistonPeriod  100.0		;# oscillation time constant (fs)
langevinPistonDecay   50.0		;# damping time constant (fs)
langevinPistonTemp    $temperature	;# noise temperature (K) (should be equal to langevinTemp)
}

# Output

# NOTE: NAMD always returns:
# - a pdb file containing the final coordinates of all atoms in the system (.coor)
# - a pdb file containing the final velocities of all atoms in the system  (.vel)

outputName          $outputname

restartfreq         500 ;# 500steps = every 1ps

# NOTE: A dcd file contains only atomic coordinates. It provides a trajectory of the system over the runtime.

dcdfreq             250	;# number of time steps between writing new coordinates to the dcd output file.
xstFreq             250 ;# extended system trajectory file for periodic cell parameters. number of time steps between writing new coordinates.
outputEnergies      100 ;# number of time steps between each output of system energies
outputPressure      100 ;# number of time steps between each output of system pressure


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################


#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
minimize            100 ;# number of iterations over which to search for local minimum
reinitvels          $temperature ;# resets atomic velocities to target temperature

run 2500 ;# number of time steps over which to run MD equilibration (5ps)

# WARN:  REQUIRED CONFIG FILE PARAMETERS
# coordinates, 
# structure, 
# parameters, 
# exclude,
# outputname, 
# numsteps 
# and exactly one of the following: temperature, velocities, or binvelocities
